{% extends "base.html" %}
{% block contenido %}
<h1>Nueva cotización</h1>
<form method="post" id="form-cotizacion">
  <fieldset>
    <legend>Cliente</legend>
    <label>Cliente registrado
      <select name="cliente_id" id="cliente_id">
        <option value="">— Nuevo cliente —</option>
        {% for c in clientes %}
        <option value="{{ c.id }}">{{ c.name }}{% if c.company %} ({{ c.company }}){% endif %}</option>
        {% endfor %}
      </select>
    </label>
    <label>Nombre del cliente <input name="cliente_nombre" id="cliente_nombre" required></label>
    <label>Empresa <input name="cliente_empresa"></label>
    <label>Teléfono <input name="cliente_telefono"></label>
    <label>Correo <input name="cliente_email" type="email"></label>
  </fieldset>

  <fieldset>
    <legend>Productos o servicios</legend>
    <div id="items">
      <div class="item">
        <select class="catalogo-select">
          <option value="">— Elegir del catálogo —</option>
          {% for p in catalogo %}
          <option value="{{ p.name }}" data-precio="{{ p.price }}" data-unidad="{{ p.unit }}">{{ p.name }} — {{ p.price | mxn }}</option>
          {% endfor %}
        </select>
        <input name="descripcion[]" placeholder="Descripción" required>
        <input name="cantidad[]" type="number" step="0.01" min="0.01" value="1" placeholder="Cant.">
        <input name="precio[]" type="number" step="0.01" min="0" value="0" placeholder="Precio">
        <input name="unidad[]" value="pieza" placeholder="Unidad">
      </div>
    </div>
    <button type="button" id="agregar-item">+ Agregar otro</button>
  </fieldset>

  <fieldset>
    <legend>Totales</legend>
    <label>Título <input name="titulo" value="Cotización de servicios"></label>
    <label>Descuento (%) <input name="descuento" type="number" step="0.01" min="0" max="100" value="0"></label>
    <label>IVA (%) <input name="iva" type="number" step="0.01" min="0" value="{{ perfil.default_tax_percent }}"></label>
    <label>Vigencia (días) <input name="vigencia_dias" type="number" min="1" value="{{ perfil.default_validity_days }}"></label>
    <label>Notas <input name="notas" value="{{ perfil.notes }}"></label>
  </fieldset>
  <button type="submit" class="primario">Crear cotización</button>
</form>
<script>
document.getElementById('agregar-item').onclick = () => {
  const primero = document.querySelector('.item');
  const copia = primero.cloneNode(true);
  copia.querySelectorAll('input').forEach(i => { if (i.name === 'cantidad[]') i.value = 1; else if (i.name === 'precio[]') i.value = 0; else if (i.name !== 'unidad[]') i.value = ''; });
  document.getElementById('items').appendChild(copia);
  conectarCatalogo(copia);
};
function conectarCatalogo(fila) {
  const sel = fila.querySelector('.catalogo-select');
  sel.onchange = () => {
    const opt = sel.selectedOptions[0];
    if (!opt.value) return;
    fila.querySelector('input[name="descripcion[]"]').value = opt.value;
    fila.querySelector('input[name="precio[]"]').value = opt.dataset.precio;
    fila.querySelector('input[name="unidad[]"]').value = opt.dataset.unidad;
  };
}
document.querySelectorAll('.item').forEach(conectarCatalogo);
document.getElementById('cliente_id').onchange = (e) => {
  document.getElementById('cliente_nombre').required = !e.target.value;
};
</script>
{% endblock %}
